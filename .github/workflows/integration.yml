name: Supply-Chain Odoo Integration Tests

# 历史注记：本工作流原位于 supply-chain-odoo-tests/.github/workflows/ci.yml，
# 因不在仓库根 .github/workflows/ 下从未被 GitHub 触发（覆盖率+mutation 门禁
# 一直失效）。2026-07-28 移至根目录激活；step 内容零改动（均自带
# working-directory，本就按仓库根运行设计），仅补 edited 触发与手动触发。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # covdata/（.coveragerc + sitecustomize/）由 checkout 产生，归 runner 所有；
      # 容器内 odoo 用户(uid 101)要往里写 .coverage.* 数据文件，须先放开写权限，
      # 否则覆盖率静默不落盘 → combine 报 No data to combine（与 logs/ sudo 同类坑）
      - name: Make covdata writable for container user
        working-directory: supply-chain-odoo-tests
        run: chmod -R 0777 covdata

      - name: Start被测 Odoo + Postgres (docker compose)
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for Odoo
        working-directory: supply-chain-odoo-tests
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose -f docker-compose.test.yml logs odoo; exit 1

      # 覆盖率装在容器持久卷内，CI 全新卷须先装（sitecustomize 缺它会静默不测量）。
      # gevent 一并装：.coveragerc 的 concurrency=thread,gevent 依赖它，而 odoo:18.0
      # 是滚动 tag，CI 现拉的新镜像可能没有 gevent（本地旧镜像有 24.2.1，已实测漂移；
      # 缺它时 coverage 启动抛 ConfigError 被 sitecustomize 的 except 静默吞掉→零数据）
      - name: Install coverage inside odoo container
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml exec -T odoo \
            python3 -m pip install --break-system-packages --quiet coverage gevent

      # 诊断步骤（排障用，问题定位后可删）：确认 coverage/gevent 可导入、
      # site-packages 内容、神秘 a1_coverage.pth 的内容与来源
      - name: Diagnose coverage runtime
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml exec -T odoo bash -c '
            echo "== python/coverage/gevent 版本 =="
            python3 -c "import sys; print(sys.version)"
            python3 -c "import coverage; print(\"coverage\", coverage.__version__)" || true
            python3 -c "import gevent; print(\"gevent\", gevent.__version__)" || true
            echo "== 用户 site-packages 一览 =="
            ls -la /var/lib/odoo/.local/lib/python3.12/site-packages/ 2>/dev/null || true
            echo "== pth 文件内容 =="
            for f in /var/lib/odoo/.local/lib/python3.12/site-packages/*.pth; do
              [ -f "$f" ] && echo "--- $f ---" && cat "$f"
            done || true
            echo "== COVERAGE_PROCESS_START / PYTHONPATH =="
            env | grep -E "COVERAGE|PYTHONPATH" || true
            echo "== /mnt/covdata 内容 =="
            ls -la /mnt/covdata/ || true
          '

      - name: Initialize test DB and install modules
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml run --rm odoo odoo \
            -i supply_chain_demo,sc_ai,sc_log_trace -d test_supplychain --stop-after-init

      - name: Restart Odoo to load installed modules
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml restart odoo

      - name: Wait for Odoo after restart
        working-directory: supply-chain-odoo-tests
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose -f docker-compose.test.yml logs odoo; exit 1

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: supply-chain-odoo-tests
        run: python -m pytest -v --junitxml=report.xml

      # ---- 覆盖率门禁：多进程 sitecustomize 采集，容器内出报告（posix 路径匹配）----
      # 阈值 70%：最近实测 78.8%（40 条用例），留 ~9pt 余量防抖动。
      - name: Coverage gate (fail under 70%)
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml stop odoo   # SIGTERM 触发落盘
          sleep 6
          echo "== 落盘现场：covdata/（应出现 .coverage.* 数据文件）=="
          ls -la covdata/ || true
          docker compose -f docker-compose.test.yml run --rm odoo \
            python3 -m coverage combine --data-file=/mnt/covdata/.coverage /mnt/covdata
          docker compose -f docker-compose.test.yml run --rm odoo \
            python3 -m coverage report --data-file=/mnt/covdata/.coverage \
            --precision=1 --fail-under=70 | tee coverage_report.txt
          docker compose -f docker-compose.test.yml start odoo
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; exit 1

      # ---- Mutation 门禁（A2 反假绿）：6 个变异点（M1–M6），任一未被抓住则失败 ----
      # M1 PR状态机 / M2 C3收货批次守卫 / M3 配方用量约束 / M4 供应商确认状态机
      # / M5 PO审批守卫 / M6 无供应商守卫；注入-重启-验红-还原由脚本自治（finally 还原）。
      - name: Mutation gate (6 mutants must be caught)
        working-directory: supply-chain-odoo-tests
        run: python mutation_gate.py 2>&1 | tee mutation_out.txt; exit ${PIPESTATUS[0]}

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: supply-chain-odoo-tests/report.xml

      - name: Upload healer audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healer-audit
          path: supply-chain-odoo-tests/healer_audit.jsonl

      - name: Upload mutation test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-output
          path: supply-chain-odoo-tests/mutation_out.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: supply-chain-odoo-tests/coverage_report.txt

  # ---- 报告聚合：离线跑 L4 评测 + L6 监控，统一渲染 HTML 仪表盘 + Markdown 汇总 ----
  # 入口点：Actions 运行页的 Step Summary（Markdown）+ 产物 qa-reports（dashboard.html）
  qa-reports:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run L4 eval (offline sim)
        working-directory: supply-chain-odoo-tests
        run: python -m eval.run_eval --mode sim

      - name: Run L6 monitor (offline sim)
        working-directory: supply-chain-odoo-tests
        run: python -m prodmon.run_monitor --mode sim

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ..

      - name: Aggregate reports (dashboard + markdown)
        working-directory: supply-chain-odoo-tests
        run: |
          python -m reports.build --ci >> $GITHUB_STEP_SUMMARY
          # 把覆盖率并入汇总页（coverage gate 产物）
          if [ -f ../supply-chain-odoo-tests/coverage_report.txt ]; then
            { echo ""; echo "## CI 覆盖率（coverage gate, fail-under 70%）"; echo "";
              echo '```'; tail -n 3 ../supply-chain-odoo-tests/coverage_report.txt; echo '```'; } >> reports/summary.md
          fi

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            supply-chain-odoo-tests/reports/dashboard.html
            supply-chain-odoo-tests/reports/summary.md
            supply-chain-odoo-tests/eval/eval_report.json
            supply-chain-odoo-tests/prodmon/prod_report.json
            supply-chain-odoo-tests/reports/metrics_history.jsonl
