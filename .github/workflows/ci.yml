name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  # L6 定时巡检：每日 01:30 UTC（北京 09:30）跑离线门禁（ai-eval + prod-monitor），
  # 作为与代码变更解耦的每日回归哨兵；重型 docker 任务（rpc/ui）定时触发时跳过。
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# 两套黑盒测试：
#  - rpc-tests：外部 pytest 客户端经 XML-RPC 驱动隔离实例(18069)，验证业务守卫/状态机/数值（59 条）
#  - ui-tests：Playwright 装在 Odoo 容器内，真实浏览器驱动主实例(8069)，验证呈现层（B01/B02）
# 两者都不 import odoo、都不修改 SUT 业务代码（黑盒红线）。

jobs:
  rpc-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start test database
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml up -d db

      - name: Init test DB and install modules
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml run --rm odoo odoo -i supply_chain_demo,sc_ai,sc_log_trace -d test_supplychain --stop-after-init

      - name: Start Odoo (isolated instance :18069)
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml up -d odoo

      - name: Wait for Odoo
        working-directory: supply-chain-odoo-tests
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose -f docker-compose.test.yml logs odoo; exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Run RPC black-box tests
        working-directory: supply-chain-odoo-tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Upload RPC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-junit-report
          path: supply-chain-odoo-tests/report.xml

  ui-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: docker compose up -d db

      - name: Init DB and install modules (main instance :8069)
        run: docker compose run --rm odoo odoo -i supply_chain_demo,sc_ai -d supplychain --stop-after-init

      - name: Start Odoo
        run: docker compose up -d odoo

      - name: Wait for Odoo
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose logs odoo; exit 1

      - name: Install Playwright + Chromium inside the Odoo container
        run: docker compose exec -u root odoo bash -c "pip install -q --break-system-packages pytest playwright pytest-playwright && python3 -m playwright install chromium && python3 -m playwright install-deps chromium"

      - name: Copy UI tests into container
        run: |
          docker compose exec -u root odoo mkdir -p /mnt/ui_tests
          CID=$(docker compose ps -q odoo)
          docker cp supply-chain-odoo-tests/ui_tests/. "$CID:/mnt/ui_tests/"

      - name: Run UI tests inside the container
        run: |
          docker compose exec -T odoo bash -c "cd /mnt/ui_tests && python3 -m pytest -v -p no:cacheprovider --junitxml=report.xml"
          CID=$(docker compose ps -q odoo)
          docker cp "$CID:/mnt/ui_tests/report.xml" supply-chain-odoo-tests/ui_tests/report.xml

      - name: Upload UI report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-junit-report
          path: supply-chain-odoo-tests/ui_tests/report.xml

  # L4 AI 评测 + §8 有效性度量：纯离线，无需 Odoo/docker，作为 AI 质量门禁。
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: AI 评测门禁 (L4)
        working-directory: supply-chain-odoo-tests
        run: python -m eval.run_eval --mode sim --fail-under 80

      - name: AI 评测 pytest 断言
        working-directory: supply-chain-odoo-tests
        run: python -m pytest tests/test_eval.py -v

      # 评测可信度第 3 层（mutation of judge）：对裁判本身做变异——坏样本必须被抓、
      # 好样本不得误杀、盲区如实呈现。judge_mutation 失败（exit 1）即熔断本 job，
      # 阻止「失灵的裁判 + 仍绿的报告」同时过关。纯离线秒级，无 Odoo/docker。
      - name: 裁判变异集 (评测可信度第3层)
        working-directory: supply-chain-odoo-tests
        run: python -m eval.judge_mutation

      - name: 体系有效性度量 (§8)
        working-directory: supply-chain-odoo-tests
        run: python -m eval.effectiveness

      - name: Upload AI eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: |
            supply-chain-odoo-tests/eval/eval_report.json
            supply-chain-odoo-tests/eval/effectiveness_report.json
            supply-chain-odoo-tests/eval/judge_mutation_report.json

  # 支柱三·增量止血：PR 必须引用 KB 已登记的 REQ-xxx；intents.yml 的 req 必须真实存在。
  # 轻量纯离线（秒级），放最前面快速反馈。PR 文本经环境变量传入（防 shell 注入）。
  req-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml

      - name: KB 自校验
        working-directory: supply-chain-odoo-tests
        run: python -m kb.store validate

      - name: REQ 关联门禁（PR 标题+描述 / intents）
        working-directory: supply-chain-odoo-tests
        env:
          PR_TEXT: "${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"
        run: python -m kb.gate --text-env PR_TEXT --intents fence/intents.yml

  # 支柱一·行为围栏：base(PR目标分支代码) vs head(本PR代码) 双实例跑同一场景库，
  # diff − intents.yml = 回归嫌疑；嫌疑不为零禁止合并（verdict exit 1）。
  # 仅 PR 触发：围栏语义是"本次变更前后对比"，push/schedule 无 base 可比。
  behavior-fence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # base 版本代码单独 checkout，供 base 实例挂载
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base-src

      - name: Start head instance (:18069)
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml up -d db
          docker compose -f docker-compose.test.yml run --rm odoo odoo -i supply_chain_demo,sc_ai -d test_supplychain --stop-after-init
          docker compose -f docker-compose.test.yml up -d odoo

      - name: Start base instance (:28069, addons=base ref)
        working-directory: supply-chain-odoo-tests
        env:
          FENCE_BASE_ADDONS: ${{ github.workspace }}/base-src/custom_addons
        run: |
          sudo mkdir -p logs/odoo-base
          docker compose -f docker-compose.base.yml -p fence-base run --rm odoo odoo -i supply_chain_demo,sc_ai -d test_supplychain --stop-after-init
          docker compose -f docker-compose.base.yml -p fence-base up -d odoo

      - name: Wait for both instances
        run: |
          for port in 18069 28069; do
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/web/login" > /dev/null; then ok=1; break; fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then echo "port $port not ready"; exit 1; fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Run fence on both targets (shared run_id)
        working-directory: supply-chain-odoo-tests
        run: |
          RUN_ID="pr${{ github.event.pull_request.number }}_${{ github.run_number }}"
          python -m fence.runner --target base --run-id "$RUN_ID"
          python -m fence.runner --target head --run-id "$RUN_ID"
          python -m fence.diff "fence/captures/base_${RUN_ID}.json" "fence/captures/head_${RUN_ID}.json" || true
          python -m fence.verdict fence/captures/diff_report.json --intents fence/intents.yml

      - name: Upload fence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-fence-report
          path: |
            supply-chain-odoo-tests/fence/captures/diff_report.json
            supply-chain-odoo-tests/fence/captures/verdict_report.json

  # L6 生产监控与治理：纯离线，无需 Odoo/docker，作为生产治理门禁。
  prod-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: 生产监控门禁 (L6)
        working-directory: supply-chain-odoo-tests
        run: python -m prodmon.run_monitor --mode sim --fail-under 80

      - name: 生产监控 pytest 断言
        working-directory: supply-chain-odoo-tests
        run: python -m pytest tests/test_prodmon.py -v

      - name: Upload prod monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-monitor-report
          path: |
            supply-chain-odoo-tests/prodmon/prod_report.json
            supply-chain-odoo-tests/prodmon/prod_alert.json
