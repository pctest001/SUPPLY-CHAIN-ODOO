[project]
name = "supply-chain-odoo-tests"
version = "0.1.0"
description = "自动化测试工程：以 RPC 黑盒驱动 supply-chain-odoo"
requires-python = ">=3.10"
dependencies = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: M1 冒烟 - 实例可达/模块已装/多公司前置",
    "struct: M2 结构型断言 - 守卫/约束/selection 拦截",
    "business: M2 业务数值断言 - PRD 来源的状态/字段",
    "ai: AI 智能层降级验证",
    "multicompany: 多公司隔离前置验证",
    "receipt: 收货/批次/出库守卫（C3/D1/D3/D4）",
    "supplierack: 供应商确认单动作/compute/向导（E1 供应商协同）",
    "poapproval: 采购订单审批流动作/守卫（C2 采购审批）",
    "logtrace: sc_log_trace 请求追踪",
]
