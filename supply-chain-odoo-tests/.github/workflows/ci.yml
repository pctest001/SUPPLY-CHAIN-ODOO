name: Supply-Chain Odoo Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start被测 Odoo + Postgres (docker compose)
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for Odoo
        working-directory: supply-chain-odoo-tests
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose -f docker-compose.test.yml logs odoo; exit 1

      - name: Initialize test DB and install modules
        working-directory: supply-chain-odoo-tests
        run: |
          docker compose -f docker-compose.test.yml run --rm odoo odoo \
            -i supply_chain_demo,sc_ai -d test_supplychain --stop-after-init

      - name: Restart Odoo to load installed modules
        working-directory: supply-chain-odoo-tests
        run: docker compose -f docker-compose.test.yml restart odoo

      - name: Wait for Odoo after restart
        working-directory: supply-chain-odoo-tests
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:18069/web/login; then echo "odoo ready"; exit 0; fi
            sleep 3
          done
          echo "odoo not ready"; docker compose -f docker-compose.test.yml logs odoo; exit 1

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: supply-chain-odoo-tests
        run: python -m pytest -v --junitxml=report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: supply-chain-odoo-tests/report.xml

      - name: Upload healer audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healer-audit
          path: supply-chain-odoo-tests/healer_audit.jsonl
